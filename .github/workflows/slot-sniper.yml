name: Cloud Slot Sniper Scheduled Runner

on:
  schedule:
    # 涵蓋爽爆、茄子、贏麻三大品牌之每日發送時段 (台北時間對應 UTC)
    # Taipei: 00:00, 02:00, 07:00, 08:00, 10:00, 12:00, 14:00, 15:00, 18:00, 20:00, 22:00
    # UTC:    16:00, 18:00, 23:00, 00:00, 02:00, 04:00, 06:00, 07:00, 10:00, 12:00, 14:00
    - cron: '0 0,2,4,6,7,10,12,14,16,18,23 * * *'
  workflow_dispatch:
    inputs:
      brand:
        description: '選擇欲執行的品牌'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - all
          - shuangbao
          - qiezi
          - yingma

jobs:
  run-snipers:
    # Keep the existing Windows schedules active until cloud auth and routing are verified.
    if: github.event_name == 'workflow_dispatch' || vars.SLOT_SNIPER_CLOUD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 📥 下載專案代碼
        uses: actions/checkout@v4

      - name: 🟢 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 安裝核心相依套件
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: 🎰 執行雲端機台狙擊手
        env:
          HEADLESS: 'true'
          NODE_ENV: 'production'
          SHUANGBAO_TELEGRAM_BOT_TOKEN: ${{ secrets.SHUANGBAO_TELEGRAM_BOT_TOKEN }}
          SHUANGBAO_TELEGRAM_CHAT_ID: ${{ secrets.SHUANGBAO_TELEGRAM_CHAT_ID }}
          QIEZI_TELEGRAM_BOT_TOKEN: ${{ secrets.QIEZI_TELEGRAM_BOT_TOKEN }}
          QIEZI_TELEGRAM_CHAT_ID: ${{ secrets.QIEZI_TELEGRAM_CHAT_ID }}
          YINGMA_TELEGRAM_BOT_TOKEN: ${{ secrets.YINGMA_TELEGRAM_BOT_TOKEN }}
          YINGMA_TELEGRAM_CHAT_ID: ${{ secrets.YINGMA_TELEGRAM_CHAT_ID }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          TARGET_BRAND="${{ github.event.inputs.brand || 'auto' }}"
          echo "執行模式: $TARGET_BRAND"
          if [ "$TARGET_BRAND" = "auto" ]; then
            node 04-slot-sniper/run-cloud-sniper.mjs --auto
          else
            node 04-slot-sniper/run-cloud-sniper.mjs --brand=$TARGET_BRAND
          fi
